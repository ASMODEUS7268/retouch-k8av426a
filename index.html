<style>
/* Layout: a retoucher's workspace. Neutral panel greys (colour-safe surround), big comparison frames, notes column in mono like a layers panel. */
:root {
  --bg: #e9e9e8;
  --panel: #f6f6f5;
  --fg: #1c1d1f;
  --muted: #5d6066;
  --line: #d2d2d0;
  --accent: #0d66d0;
  --on-accent: #ffffff;
  --frame: #2b2b2b;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem);
  --step-3: clamp(2rem, 1.2rem + 3.6vw, 3.6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262626; --panel: #323232; --fg: #e8e8e8; --muted: #a3a3a3; --line: #424242;
    --accent: #3b8cf0; --on-accent: #0b1220; --frame: #1a1a1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262626; --panel: #323232; --fg: #e8e8e8; --muted: #a3a3a3; --line: #424242;
  --accent: #3b8cf0; --on-accent: #0b1220; --frame: #1a1a1a; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: var(--step-0); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1240px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.mono { font-family: var(--f-mono); font-size: var(--step--1); }
.eyebrow { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
button { font: inherit; color: inherit; }

/* ---------- header ---------- */
header.top { padding-block: 40px 32px; display: grid; gap: 20px; border-bottom: 1px solid var(--line); }
.idrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.who { font-family: var(--f-display); font-weight: 500; font-size: var(--step-1); }
.where { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); }
.lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.lang button { background: transparent; border: 0; padding: 6px 12px; font-family: var(--f-mono); font-size: var(--step--1); cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
header.top h1 { font-size: var(--step-3); font-weight: 700; line-height: 1.05; max-width: 17ch; }
header.top p { max-width: 62ch; margin: 0; color: var(--muted); font-size: var(--step-1); line-height: 1.5; }
.pipeline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pipeline span { font-family: var(--f-mono); font-size: var(--step--1); padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.pipeline i { font-style: normal; color: var(--muted); }

/* contact chip (header + footer) */
.contact { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); overflow: hidden; max-width: 100%; }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; }
.contact .addr { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: var(--f-mono); font-size: var(--step--1); user-select: all; overflow-wrap: anywhere; min-width: 0; }
.contact .addr b { color: var(--muted); font-weight: 400; user-select: none; white-space: nowrap; }
.contact a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--fg); text-decoration: none; font-family: var(--f-mono); font-size: var(--step--1); user-select: all; }
.contact a b { color: var(--muted); font-weight: 400; user-select: none; }
.contact a:hover, .contact a:focus-visible { color: var(--accent); outline: none; }
.contact button { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 8px 12px; font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); cursor: pointer; }
.contact button:hover, .contact button:focus-visible { color: var(--accent); outline: none; }

nav.sections { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.sections a { font-family: var(--f-mono); font-size: var(--step--1); color: var(--fg); text-decoration: none; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line); }
nav.sections a:hover, nav.sections a:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.hint { margin-left: auto; color: var(--muted); font-family: var(--f-mono); font-size: var(--step--1); align-self: center; }

/* ---------- sections & works ---------- */
section.group { padding-block: 56px 8px; display: grid; gap: 40px; scroll-margin-top: 64px; }
section.group > h2 { font-size: var(--step-2); font-weight: 500; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
section.group > h2 small { font-family: var(--f-mono); font-size: var(--step--1); font-weight: 400; color: var(--muted); letter-spacing: 0.04em; }

.work { display: grid; gap: 20px 32px; align-items: start; }
.work.portrait { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.work.landscape { grid-template-columns: minmax(0, 1fr); }
.work.landscape .notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 32px; }
.work.landscape .notes .head { grid-column: 1 / -1; }

.cmp { position: relative; margin: 0; background: var(--frame); border-radius: 2px; overflow: hidden; max-width: 100%;
  touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; --pos: 50%; }
.work.portrait .cmp { max-height: 86vh; }
.cmp img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.cmp img.before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.cmp .split { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; }
.cmp .knob { position: absolute; top: 50%; left: var(--pos); width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
  background: #fff; color: #1c1d1f; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.35); pointer-events: none;
  font: 600 14px/1 var(--f-mono); }
.cmp .tag { position: absolute; top: 12px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 2px; background: rgba(20,20,20,.62); color: #f2f2f2; pointer-events: none; }
.cmp .tag.l { left: 12px; } .cmp .tag.r { right: 12px; }
.cmp input[type=range] { position: absolute; inset: auto 0 0 0; width: 100%; opacity: 0; height: 1px; pointer-events: none; }
.cmp:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }

.notes { display: grid; gap: 12px; min-width: 0; }
.notes .head { display: grid; gap: 6px; }
.notes h3 { font-size: var(--step-1); font-weight: 500; }
.notes .task { margin: 0; font-size: var(--step-0); }
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 18px; position: relative; color: var(--fg); }
.notes li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 8px; height: 1px; background: var(--accent); }
.notes .tech { color: var(--muted); padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 3px; line-height: 1.7; overflow-wrap: anywhere; }
.notes .credit { color: var(--muted); }

/* ---------- process ---------- */
section.process { padding-block: 72px 24px; display: grid; gap: 28px; border-top: 1px solid var(--line); margin-top: 56px; }
section.process h2, section.hire h2 { font-size: var(--step-2); font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.steps li { background: var(--panel); padding: 18px; display: grid; gap: 8px; align-content: start; }
.steps b { font-family: var(--f-mono); font-size: var(--step--1); color: var(--accent); font-weight: 500; }
.steps h3 { font-size: var(--step-0); font-weight: 500; font-family: var(--f-body); }
.steps p { margin: 0; color: var(--muted); font-size: 0.9375rem; }

/* ---------- hire ---------- */
section.hire { padding-block: 56px 8px; display: grid; gap: 16px; border-top: 1px solid var(--line); margin-top: 48px; }
section.hire p { margin: 0; max-width: 60ch; color: var(--muted); }

footer { padding-block: 40px 0; color: var(--muted); font-size: 0.9375rem; max-width: 70ch; }

/* ---------- hero ---------- */
header.top.hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 28px 48px; align-items: center; padding-block: 36px 40px; }
.hero-text { display: grid; gap: 20px; min-width: 0; }
.hero-text .idrow { margin-bottom: 8px; }
.hero h1 { font-size: clamp(2rem, 1rem + 3.4vw, 3.8rem); line-height: 1.04; letter-spacing: -0.025em; overflow-wrap: break-word; hyphens: auto; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-fig { margin: 0; display: grid; gap: 10px; min-width: 0; }
.hero-fig .cmp { max-height: 78vh; box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
.hero-fig figcaption { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); flex-wrap: wrap; }
.hero-bottom { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.stats { display: flex; flex-wrap: wrap; gap: 12px 56px; margin: 0; }
.stats dd { white-space: nowrap; }
.stats div { display: grid; gap: 2px; }
.stats dt { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); letter-spacing: 0.04em; order: 2; }
.stats dd { margin: 0; font-family: var(--f-display); font-size: var(--step-2); font-weight: 500; font-variant-numeric: tabular-nums; order: 1; }

/* ---------- contact sheet ---------- */
.sheet { padding-block: 20px 4px; display: grid; gap: 10px; }
.sheet-strip { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: var(--frame); border-radius: 3px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.sheet-strip a { flex: 0 0 auto; display: grid; gap: 6px; text-decoration: none; scroll-snap-align: start; border-radius: 2px; }
.sheet-strip img { height: 92px; width: auto; display: block; border-radius: 2px; opacity: .82; transition: opacity .2s, transform .2s; }
.sheet-strip span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; color: #e0b54a; }
.sheet-strip a:hover img, .sheet-strip a:focus-visible img { opacity: 1; transform: translateY(-2px); }
.sheet-strip a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- marketplace cards ---------- */
.cards-lead { margin: -16px 0 0; max-width: 64ch; color: var(--muted); }
.cardset { display: grid; gap: 14px; padding-top: 28px; border-top: 1px solid var(--line); }
.cardset + .cardset { margin-top: 28px; }
.cardset-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; }
.cardset-head h3 { font-size: var(--step-1); font-weight: 500; }
.cardset-head span { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); }
.cardset-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cardset-grid a { display: block; border-radius: 6px; overflow: hidden; background: var(--frame); aspect-ratio: 3 / 4; box-shadow: 0 18px 36px -24px rgba(0,0,0,.5); transition: transform .2s, box-shadow .2s; }
.cardset-grid a:hover, .cardset-grid a:focus-visible { transform: translateY(-3px); box-shadow: 0 26px 44px -24px rgba(0,0,0,.6); outline: none; }
.cardset-grid a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cardset-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cardset-grid figcaption { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); padding-top: 6px; }
.cardset-grid figure { margin: 0; display: grid; }
@media (max-width: 640px) { .cardset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- work polish ---------- */
section.group > h2 .count { font-family: var(--f-mono); font-size: var(--step--1); font-weight: 400; color: var(--on-accent); background: var(--accent); padding: 2px 8px; border-radius: 99px; letter-spacing: .04em; align-self: center; }
.work { padding-top: 40px; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
section.group > h2 + .work { border-top: 0; padding-top: 0; }
.notes .frame-no { font-family: var(--f-display); font-size: var(--step-2); font-weight: 500; color: var(--line); line-height: 1; }
.cmp { transition: box-shadow .3s; }
.work .cmp:hover { box-shadow: 0 24px 48px -28px rgba(0,0,0,.5); }

@media (max-width: 860px) {
  header.top.hero { grid-template-columns: minmax(0, 1fr); }
  .hero-bottom { grid-template-columns: minmax(0, 1fr); }
  .work.portrait { grid-template-columns: minmax(0, 1fr); }
  .work.landscape .notes { grid-template-columns: minmax(0, 1fr); }
  .hint { display: none; }
  header.top { padding-block: 28px 24px; }
}
</style>

let heroPlayed = false;
function renderHero(L) {
  const w = WORKS.find(x => x.id === "beauty_acne_11"), t = w[LANG];
  const fig = document.getElementById("hero-fig");
  fig.innerHTML = `<div class="cmp" style="aspect-ratio:${w.w}/${w.h}">${cmpHTML(w, t, L).replace(/id="r-/, 'id="hero-r-')}</div>
    <figcaption><span>${L.heroCap[0]}</span><span>${L.heroCap[1]}</span></figcaption>`;
  const c = fig.querySelector(".cmp"); wire(c);
  // one gentle sweep on first load so the difference is visible at once
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (heroPlayed || reduce) return; heroPlayed = true;
  const keys = [[0, 50], [700, 22], [1700, 80], [2500, 50]]; let start = null, stop = false;
  c.addEventListener("pointerdown", () => { stop = true; }, { once: true });
  const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const step = (ts) => {
    if (stop) return; if (start === null) start = ts; const el = ts - start - 600;
    if (el < 0) { requestAnimationFrame(step); return; }
    let p = 50; for (let i = 1; i < keys.length; i++) { if (el <= keys[i][0]) { const a = keys[i-1], b = keys[i]; p = a[1] + (b[1] - a[1]) * ease((el - a[0]) / (b[0] - a[0])); break; } }
    c.style.setProperty("--pos", p + "%");
    if (el < keys[keys.length - 1][0]) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    <figure class="cmp" style="aspect-ratio:${w.w}/${w.h}">
      ${cmpHTML(w, t, L)}
    </figure>
    <div class="notes">
      <div class="head"><div class="frame-no" aria-hidden="true">${pad2(n)}</div><div class="eyebrow">${L.frame} ${pad2(n)} · ${t.genre}</div><h3>${t.title}</h3><p class="task">${t.task}</p></div>
      <ul>${t.done.map(d => `<li>${d}</li>`).join("")}</ul>
      <div class="tech mono">${t.tech}</div>
      <div class="credit mono">${t.credit}</div>
    </div>`;
  wire(el.querySelector(".cmp"));
  return el;
}

function wire(fig) {
  const range = fig.querySelector("input");
  const set = (p) => { p = Math.max(0, Math.min(100, p)); fig.style.setProperty("--pos", p + "%"); range.value = Math.round(p); };
  let dragging = false;
  const fromEvent = (e) => { const r = fig.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 100); };
  fig.addEventListener("pointerdown", (e) => { dragging = true; fig.setPointerCapture(e.pointerId); fromEvent(e); range.focus({ preventScroll: true }); });
  fig.addEventListener("pointermove", (e) => { if (dragging) fromEvent(e); });
  fig.addEventListener("pointerup", () => { dragging = false; });
  fig.addEventListener("pointercancel", () => { dragging = false; });
  range.addEventListener("input", () => set(+range.value));
  range.addEventListener("keydown", (e) => {
    if (e.key === "Home") { set(0); e.preventDefault(); }
    if (e.key === "End") { set(100); e.preventDefault(); }
  });
}

function render() {
  const L = T[LANG];
  document.documentElement.lang = LANG;
  document.title = LANG === "ru" ? "Портфолио ретуши · Yulian" : "Retouching portfolio · Yulian";
  for (const el of document.querySelectorAll("[data-i]")) { const v = L[el.dataset.i]; if (typeof v === "string") el.textContent = v; }
  document.getElementById("pipeline").innerHTML = L.pipeline.map(s => `<span>${s.replace("&", "&amp;")}</span>`).join("<i>→</i>");
  document.getElementById("steps").innerHTML = L.steps.map(s => `<li><b>${s[0]}</b><h3>${s[1].replace("&", "&amp;")}</h3><p>${s[2]}</p></li>`).join("");
  document.getElementById("h1").innerHTML = L.h1;
  document.getElementById("stats").innerHTML = L.stats.map(s => `<div><dt>${s[1]}</dt><dd>${s[0]}</dd></div>`).join("");
  document.getElementById("sheet").innerHTML = ORDER.map((w, i) => `<a href="#${w.id}" title="${w[LANG].title}"><img src="img/thumbs/${w.id}.jpg" alt="${w[LANG].title}" decoding="async" width="${Math.round(92 * w.w / w.h)}" height="92"><span>${pad2(i + 1)}</span></a>`).join("");
  renderHero(L);
  for (const g of GROUPS) {
    const sec = document.getElementById(g);
    for (const a of sec.querySelectorAll(":scope > article")) a.remove();
    const h2 = sec.querySelector("h2"); let cnt = h2.querySelector(".count");
    if (!cnt) { cnt = document.createElement("span"); cnt.className = "count"; h2.appendChild(cnt); }
    cnt.textContent = pad2(WORKS.filter(w => w.group === g).length);
  }
  ORDER.forEach((w, i) => document.getElementById(w.group).appendChild(card(w, w[LANG], L, i + 1)));
  const CARDSETS = [
    { id: "headphones", files: ["card_01_cover", "card_02_benefits", "card_03_specs"], credit: "Caleb Oquendo (Pexels)" },
    { id: "cream", files: ["card_01_cover", "card_02_ingredients", "card_03_howto"], credit: "Deepa Nishad (Pexels)" },
    { id: "sneakers", files: ["card_01_cover", "card_02_details", "card_03_sizes"], credit: "saeed karimi (Pexels)" }];
  document.getElementById("cards-list").innerHTML = CARDSETS.map((cs, si) => `
    <div class="cardset">
      <div class="cardset-head"><h3>${L.cardsets[si][0]}</h3><span>${L.cardsets[si][1]} · ${L.cardcredit} ${cs.credit}</span></div>
      <div class="cardset-grid">${cs.files.map((f, fi) => `<figure><a href="img/cards/${cs.id}_${f}.jpg" target="_blank" rel="noopener"><img src="img/cards/${cs.id}_${f}.jpg" alt="${L.cardsets[si][0]}: ${L.cardnames[si * 3 + fi]}" loading="lazy" decoding="async" width="900" height="1200"></a><figcaption>${pad2(fi + 1)} · ${L.cardnames[si * 3 + fi]}</figcaption></figure>`).join("")}</div>
    </div>`).join("");
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
}

for (const b of document.querySelectorAll(".lang button")) b.addEventListener("click", () => {
  LANG = b.dataset.lang; try { localStorage.setItem("lang", LANG); } catch (e) {}
  render();
});

for (const btn of document.querySelectorAll(".contact .copy")) btn.addEventListener("click", () => {
  const L = T[LANG];
  const done = (msg) => { btn.textContent = msg; setTimeout(() => { btn.textContent = T[LANG].copy; }, 1600); };
  try {
    navigator.clipboard.writeText(btn.dataset.copy).then(() => done(L.copied), () => {
      const a = btn.previousElementSibling; const r = document.createRange(); r.selectNodeContents(a); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(L.copyFail);
    });
  } catch (e) { done(L.copyFail); }
});

render();
</script>
